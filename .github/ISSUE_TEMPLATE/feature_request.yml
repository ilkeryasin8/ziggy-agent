name: Feature idea
description: Something Ziggy should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to get done and where Ziggy got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The behaviour you want. If it changes what the agent may do, say how it stays safe.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
